name: Release

# Release flow (mirrors cardano-foundation/nova-slim):
#
#   Pushing a tag (e.g. v0.1.0) triggers this workflow. It:
#     1. builds the optimized zsat binary for each supported platform,
#     2. packages each one (tar.gz),
#     3. creates a DRAFT release with GitHub's auto-generated notes and the
#        binaries + a sha256sums file attached.
#   A human then publishes the draft in the GitHub UI.
#
# NOTE: GitHub's hardened Releases API refuses GITHUB_TOKEN when the tagged
# commit modifies workflow files. To support that case, set a fine-grained PAT
# in the RELEASE_TOKEN secret (Contents: read/write and Workflows on this repo).
# When RELEASE_TOKEN is not configured the workflow falls back to the default
# GITHUB_TOKEN, which is sufficient for tags that do not touch workflow files.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-macos
            name: macos-aarch64
          # macOS runners are arm64; Zig cross-compiles the Intel slice.
          - os: macos-latest
            target: x86_64-macos
            name: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build zsat (release)
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/zsat-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C zig-out/bin zsat
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zsat-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > "zsat-${{ github.ref_name }}-sha256sums.txt"
          cat "zsat-${{ github.ref_name }}-sha256sums.txt"

      - name: Delete stale releases for this tag
        run: |
          releases=$(gh api --paginate -H "Accept: application/vnd.github+json" "repos/${{ github.repository }}/releases" --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id')
          if [ -n "$releases" ]; then
            for id in $releases; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*-sha256sums.txt
